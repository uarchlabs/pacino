<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="486" viewBox="0 0 760 486" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <title>Figure 1 - RAS position in the BP prediction pipeline</title>
  <rect x="0" y="0" width="760" height="486" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="ahG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
  </defs>

  <!-- stage columns -->
  <g>
    <rect x="20"  y="40" width="170" height="262" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="200" y="40" width="170" height="262" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="380" y="40" width="170" height="262" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="560" y="40" width="180" height="262" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="105" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">p0</text>
    <text x="285" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">p1</text>
    <text x="465" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">p2</text>
    <text x="650" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">p3</text>
    <text x="105" y="80" text-anchor="middle" font-size="11" fill="#64748b">index / TOS read</text>
    <text x="285" y="80" text-anchor="middle" font-size="11" fill="#64748b">uBTB + Loop</text>
    <text x="465" y="80" text-anchor="middle" font-size="11" fill="#64748b">FTB + TAGE + ITTAGE + RAS</text>
    <text x="650" y="80" text-anchor="middle" font-size="11" fill="#64748b">SC + RAS repair</text>
  </g>

  <!-- predictor chips -->
  <g font-size="12" fill="#1e293b">
    <rect x="35"  y="96"  width="140" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="105" y="113" text-anchor="middle">uBTB index</text>
    <rect x="215" y="96"  width="140" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="285" y="113" text-anchor="middle">uBTB</text>
    <rect x="215" y="128" width="140" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="285" y="145" text-anchor="middle">Loop</text>
    <rect x="395" y="96"  width="140" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="465" y="113" text-anchor="middle">FTB</text>
    <rect x="395" y="128" width="140" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="465" y="145" text-anchor="middle">TAGE</text>
    <rect x="395" y="160" width="140" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="465" y="177" text-anchor="middle">ITTAGE</text>
    <rect x="575" y="96"  width="150" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/><text x="650" y="113" text-anchor="middle">SC</text>
  </g>

  <!-- RAS path -->
  <g>
    <rect x="35" y="200" width="140" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="105" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">RAS</text>
    <text x="105" y="233" text-anchor="middle" font-size="10.5" fill="#1d4ed8">combinational TOS read</text>
    <text x="105" y="247" text-anchor="middle" font-size="10.5" fill="#1d4ed8">(no push / pop)</text>

    <rect x="215" y="200" width="140" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="285" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">TOS (registered)</text>
    <text x="285" y="233" text-anchor="middle" font-size="10.5" fill="#1d4ed8">target of a uBTB</text>
    <text x="285" y="247" text-anchor="middle" font-size="10.5" fill="#1d4ed8">RETURN slot</text>

    <rect x="395" y="200" width="140" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="465" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">RAS</text>
    <text x="465" y="233" text-anchor="middle" font-size="10.5" fill="#1d4ed8">push / pop; peek</text>
    <text x="465" y="247" text-anchor="middle" font-size="10.5" fill="#1d4ed8">snapshot -&gt; FTQ</text>

    <rect x="575" y="200" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="650" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">RAS</text>
    <text x="650" y="233" text-anchor="middle" font-size="10.5" fill="#1d4ed8">repair vs. the p2 op</text>
    <text x="650" y="247" text-anchor="middle" font-size="10.5" fill="#1d4ed8">repaired snap -&gt; FTQ</text>

    <line x1="175" y1="228" x2="212" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="535" y1="228" x2="572" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
  </g>

  <!-- per-stage notes -->
  <g font-size="9.5" fill="#475569">
    <text x="105" y="276" text-anchor="middle">spec top, else commit frame</text>
    <text x="105" y="289" text-anchor="middle">at the speculative depth</text>
    <text x="285" y="276" text-anchor="middle">p1 prediction input;</text>
    <text x="285" y="289" text-anchor="middle">no RAS operation at p1</text>
    <text x="465" y="276" text-anchor="middle">peek = return target; type</text>
    <text x="465" y="289" text-anchor="middle">from FTB, p1 slots on a miss</text>
    <text x="650" y="276" text-anchor="middle">p3 type = registered p2 type;</text>
    <text x="650" y="289" text-anchor="middle">no repair on an FTB miss</text>
  </g>

  <!-- restore and commit -->
  <g>
    <rect x="35" y="318" width="420" height="76" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="48" y="337" font-size="12" font-weight="700" fill="#0f766e">Restore (FTQ redirect, not the cluster's own)</text>
    <text x="48" y="354" font-size="11" fill="#115e59">reload the snapshot; empty if its TOSR entry was reused</text>
    <text x="48" y="369" font-size="11" fill="#115e59">undo the block's own push / pop when off the path</text>
    <text x="48" y="384" font-size="11" fill="#115e59">apply a predecode / backend call or return; snapshot -&gt; FTQ</text>

    <rect x="470" y="318" width="255" height="76" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="483" y="337" font-size="12" font-weight="700" fill="#0f766e">Commit (FTQ retire)</text>
    <text x="483" y="354" font-size="11" fill="#115e59">commit stack push / pop</text>
    <text x="483" y="369" font-size="11" fill="#115e59">BOS and committed depth move</text>
    <text x="483" y="384" font-size="11" fill="#115e59">one commit per cycle</text>
  </g>

  <!-- type gate note -->
  <g>
    <rect x="35" y="408" width="690" height="64" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="48" y="428" font-size="12" font-weight="700" fill="#b45309">Type-gated; supplies a target only, no part in the direction ranking</text>
    <text x="48" y="446" font-size="11.5" fill="#92400e">Call pushes, return pops, return-call pops then pushes. Target of RETURN / RETURN_CALL only;</text>
    <text x="48" y="463" font-size="11.5" fill="#92400e">the FTB jump target is the fallback when the RAS has no valid address.</text>
  </g>
</svg>
