#
# Proposed spec: lists for the working specifications (DOC-013, Problem 3),
# for Jeff's review. NOTHING READS THIS FILE. The live lists are the spec:
# fields of tools/doc_status.yaml, and only frontend/bpu/tage.md has one.
#
# Key: path under docs/. Value: the form of a spec: list, repo paths under
# planning/arch/ or planning/interfaces/, in display order: decisions, rules,
# formats and hash rules, interfaces.
#
# Decided from the file names and the documents' own scope lines. A document
# is listed once, on the page of the unit it scopes, so a unit-level document
# is not repeated on that unit's sub-pages. UNSURE marks a mapping the IA is
# unsure of; prompts/DOC-013.md Results Capture gives each reason and lists
# the documents and pages with no mapping.

