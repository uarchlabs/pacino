#
# Status of the unwritten doc pages. tools/gen_doc_placeholders.py reads
# this table and writes a placeholder block into each listed page.
#
# Key: path under docs/, for a page; or, for a heading of a unit page
# (showcase_release_decisions.md SR-17a), the page's path, #, and the
# heading's text as the page writes it, quoted:
#   "frontend/icache/index.md#Tags":
# The heading must be on the page, once. Its block is written under it, and
# the page's title and headings are the page's own. A heading with
# headings under it and no text of its own, such as the MMU page's L2 TLB,
# has no entry. A unit page has no page entry.
#   rtl:    done | active | planned | not-in-design
#   docs:   planned | active
#   covers: one line, completing "This page will cover ..."; on a unit page
#           the site shows it as a sentence
#   see:    optional list, each item one of
#             - blog: <post slug>         with title: <post title>
#             - tasks: [<IA task ID>, ...]
#             - demo: <examples/fe_demo/docs file name, no .md>
#   guess:  true where the entry is not settled by evidence in the repo
#   spec:   optional list of planning documents shown on the page, as repo
#           paths under planning/arch/ or planning/interfaces/, in display
#           order. tools/mkdocs_showcase.py shows them at build time in place
#           of the placeholder (showcase_release_decisions.md SR-17 to SR-19);
#           the page itself keeps its placeholder block. On a unit page each
#           document is shown once, in the Overview heading, and named under
#           each heading that lists it (SR-17a)
#
# Evidence: rtl/, planning/arch/, docs/sessions.json, examples/fe_demo/,
# the README status table and directory tree, and the blog's _posts/.

