<text x="30" y="378" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">The block end is bpu_blk_pft_p2: 0x8000_0028 at cyc 56, 0x8000_0016 at cyc 71, and 0x8000_001A for the next block at cyc 98.</text>
<text x="30" y="393" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Read from out/fd23_jump_cut/fd23_jump_cut.fst.</text>
