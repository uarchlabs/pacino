<text x="340" y="116" class="mono" font-size="10" fill="#1f2328" text-anchor="middle" font-weight="bold">bne C2</text>
<text x="340" y="132" class="mono" font-size="9" fill="#59636e" text-anchor="middle" font-weight="normal">0010</text>
<rect x="396" y="100" width="56" height="40" fill="#dbe9f7" stroke="#3b6ea5" stroke-width="1"/>
