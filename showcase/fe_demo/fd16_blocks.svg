<text x="30" y="388" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Virtual addresses are 0x8001_xxxx. Physical cells show the low 16 bits of the address, in their own page.</text>
<text x="30" y="403" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">The addi reaches decode whole at cyc 109, in lane 7. The queue entry popped at cyc 94 holds both PPNs.</text>
<text x="30" y="418" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Read from out/fd16_page_cross/fd16_page_cross.fst.</text>
