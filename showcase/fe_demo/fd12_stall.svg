<text x="30" y="408" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Addresses are 0x8000_0xxx. Signal paths are under tb.dut unless they start with tb. Empty cells: the payload is not valid.</text>
<text x="30" y="423" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">A column is the interval with tb.cyc at its value. The stall rises one time unit after the marker of cyc 20, so it fills column 20,</text>
<text x="30" y="438" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">and the marker of cyc 21 is the first to show it. The update rises at the marker of cyc 21 and fills column 21.</text>
<text x="30" y="453" class="sans" font-size="11" fill="#59636e" text-anchor="start" font-weight="normal">Read from out/fd12_training/fd12_training.fst.</text>
