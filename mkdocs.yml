      - FD-9 TAGE Provider and Allocation: showcase/fe_demo/fd09_tage.md
      - FD-10 Predecode Redirect: showcase/fe_demo/fd10_pd_redirect.md
      - FD-11 Backend Mispredict: showcase/fe_demo/fd11_be_mispredict.md
      - FD-12 Predictor Training: showcase/fe_demo/fd12_training.md
      - FD-13 L1I Hit, Miss and MSHR Merge: showcase/fe_demo/fd13_l1i.md
      - FD-14 Sv39, Sv39x4 and Svadu: showcase/fe_demo/fd14_translation.md
      - FD-15 Fetch Faults: showcase/fe_demo/fd15_faults.md
      - FD-16 Fetch Block Crossing a Page: showcase/fe_demo/fd16_page_cross.md
      - FD-17 Compressed and Unaligned Code: showcase/fe_demo/fd17_rvc.md
      - FD-18 Uncached Fetch: showcase/fe_demo/fd18_uncached.md
      - FD-19 FENCE.I and cbo.inval: showcase/fe_demo/fd19_fencei_cbo.md
      - FD-20 Backpressure: showcase/fe_demo/fd20_backpressure.md
      - FD-21 Commit: showcase/fe_demo/fd21_commit.md
      - FD-22 SC Reversing Slot 1: showcase/fe_demo/fd22_sc_slot1.md
      - FD-23 A Jump Behind Two Conditionals: showcase/fe_demo/fd23_jump_cut.md
      - FD-24 A Call in Slot 1: showcase/fe_demo/fd24_call_slot1.md
      - fe_top Connectivity Inventory: showcase/fe_demo/fe_top_connectivity.md

