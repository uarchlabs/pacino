site_name: Pacino
site_url: https://uarchlabs.github.io/pacino/
site_description: Pacino RISC-V Processor Microarchitecture Documentation
site_author: uarchlabs
copyright: >
  Copyright &copy; 2026 uarchlabs &mdash;
  Documentation licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  RTL licensed under <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache 2.0</a>

repo_name: uarchlabs/pacino
repo_url: https://github.com/uarchlabs/pacino

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: black
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.footnote.tooltips

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - footnotes

# The Frontend and MMU nav entries link headings by absolute path
# (/pacino/...); MkDocs would note each one at INFO level.
validation:
  nav:
    absolute_links: ignore

hooks:
  - tools/mkdocs_showcase.py

# The Showcase scenarios the site shows and tools/publish_waves.py
# publishes; every other scenario is hidden until it is reviewed. The
# pages stay in the repo and in the nav below. Remove the list to show
# every scenario (tools/mkdocs_showcase.py, THE SHOWN LIST).
extra:
  showcase_shown:
    - fd01_reset_init
    - fd02_steady
    - fd03_two_branch
    - fd04_p2_override
    - fd05_p3_override
    - fd06_loop_pred
    - fd07_calls_returns
    - fd08_indirect
    - fd09_tage
    - fd10_pd_redirect
    - fd11_be_mispredict
    - fd12_training
    - fd13_l1i
    - fd14_translation
    - fd15_faults
    - fd16_page_cross
    - fd17_rvc
    - fd18_uncached
    - fd19_fencei_cbo
    - fd20_backpressure
    - fd21_commit
    - fd22_sc_slot1
    - fd23_jump_cut
    - fd24_call_slot1

