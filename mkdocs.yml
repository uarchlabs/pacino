      - FD-1 Reset and SRAM Initialization: showcase/fe_demo/fd01_reset_init.md
      - FD-2 Steady-State Prediction and Fetch: showcase/fe_demo/fd02_steady.md
      - FD-3 Two Branches in One Block: showcase/fe_demo/fd03_two_branch.md
      - FD-4 p2 Override: showcase/fe_demo/fd04_p2_override.md
      - FD-5 p3 Override: showcase/fe_demo/fd05_p3_override.md
      - FD-6 Loop Predictor: showcase/fe_demo/fd06_loop_pred.md
